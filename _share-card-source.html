<!DOCTYPE html>
<!-- Source for images/share-card.png (1200x630). Not published: Jekyll skips files starting with an underscore.
     Render from this folder with headless Chrome:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 --screenshot=images/share-card.png "file://$(pwd)/_share-card-source.html" -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Fraunces";
    src: url("fonts/fraunces-latin.woff2") format("woff2");
    font-weight: 400 600;
  }
  @font-face {
    font-family: "Inter";
    src: url("fonts/inter-latin.woff2") format("woff2");
    font-weight: 400 600;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #101214;
    display: flex; align-items: center;
    padding: 0 80px; gap: 64px;
    font-family: "Inter", sans-serif;
    color: #eceae6;
    overflow: hidden;
    position: relative;
  }
  .bloom {
    position: absolute;
    right: -60px; top: 50%;
    transform: translateY(-50%);
    width: 620px; height: 620px;
    background: radial-gradient(circle, rgba(201,161,90,.38), rgba(201,161,90,.07) 45%, transparent 70%);
    filter: blur(30px);
  }
  .text { flex: 1; position: relative; }
  h1 {
    font-family: "Fraunces", Georgia, serif; font-weight: 500;
    font-size: 72px; line-height: 1; letter-spacing: -.025em;
    font-variation-settings: "opsz" 144; margin-bottom: 30px;
  }
  .headline {
    font-family: "Fraunces", Georgia, serif; font-weight: 400;
    font-size: 44px; line-height: 1.2; font-variation-settings: "opsz" 72;
    max-width: 16em;
  }
  .domain {
    margin-top: 40px; color: #a8a49c; font-size: 22px; letter-spacing: .02em;
  }
  .photo {
    position: relative;
    width: 340px; height: 425px;
    border-radius: 18px; overflow: hidden;
    border: 1px solid rgba(236,234,230,.14);
    flex-shrink: 0;
  }
  .photo img {
    width: 100%; height: 100%; object-fit: cover;
    filter: grayscale(1) contrast(1.05);
  }
</style>
</head>
<body>
  <div class="bloom"></div>
  <div class="text">
    <h1>Carlos Reis</h1>
    <div class="headline">I make complicated revenue predictable.</div>
    <div class="domain">carlosreis.com.au</div>
  </div>
  <div class="photo"><img src="images/headshot.jpg" alt=""></div>
</body>
</html>
